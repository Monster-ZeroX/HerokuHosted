<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Generate Favicon</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#007AFF';
        ctx.fillRect(0, 0, 512, 512);

        // Create gradient for cloud
        const gradient = ctx.createLinearGradient(0, 0, 512, 512);
        gradient.addColorStop(0, '#007AFF');
        gradient.addColorStop(1, '#00C7FF');

        // Draw cloud
        ctx.fillStyle = gradient;
        ctx.strokeStyle = '#0051D5';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(358, 230);
        ctx.bezierCurveTo(358, 194, 333, 164, 296, 164);
        ctx.bezierCurveTo(291, 164, 286, 165, 281, 167);
        ctx.bezierCurveTo(266, 138, 240, 117, 209, 117);
        ctx.bezierCurveTo(163, 117, 128, 153, 128, 199);
        ctx.bezierCurveTo(128, 202, 128, 205, 129, 207);
        ctx.bezierCurveTo(102, 215, 82, 238, 82, 266);
        ctx.bezierCurveTo(82, 299, 107, 327, 138, 327);
        ctx.lineTo(348, 327);
        ctx.bezierCurveTo(389, 327, 419, 297, 419, 256);
        ctx.bezierCurveTo(419, 223, 394, 194, 358, 194);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Draw arrow (white)
        ctx.fillStyle = '#FFFFFF';

        // Arrow shaft
        ctx.fillRect(240, 240, 32, 100);

        // Arrow head
        ctx.beginPath();
        ctx.moveTo(256, 200);
        ctx.lineTo(210, 250);
        ctx.lineTo(240, 250);
        ctx.lineTo(240, 270);
        ctx.lineTo(272, 270);
        ctx.lineTo(272, 250);
        ctx.lineTo(302, 250);
        ctx.closePath();
        ctx.fill();

        // Draw small green circle with magnet symbol
        ctx.fillStyle = '#34C759';
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(256, 400, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Magnet symbol
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(240, 390);
        ctx.lineTo(256, 410);
        ctx.lineTo(272, 390);
        ctx.stroke();

        // Download canvas as PNG
        setTimeout(() => {
            const link = document.createElement('a');
            link.download = 'favicon.png';
            link.href = canvas.toDataURL();
            link.click();
        }, 100);
    </script>
</body>
</html>
